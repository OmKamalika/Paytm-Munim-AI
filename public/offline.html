<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#002e6e">
<title>PayTMunim offline</title>
<style>
  :root { --navy:#002e6e; --ink:#1d2d3e; --muted:#64768a; --page:#f5f7fa; --card:#ffffff; --line:#dce5ed; }
  @media (prefers-color-scheme: dark) { :root { --ink:#e7eef5; --muted:#a7b6c6; --page:#0d1724; --card:#152234; --line:#26374c; } }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--page); color:var(--ink); font-family:Inter,"Segoe UI",Arial,sans-serif; padding:16px; box-sizing:border-box; }
  main { max-width:420px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px; }
  h1 { font-size:20px; margin:0 0 8px; }
  p { color:var(--muted); line-height:1.5; margin:0 0 12px; font-size:14px; }
  button { min-height:48px; width:100%; border:0; border-radius:8px; background:var(--navy); color:#fff; font-weight:700; font-size:14px; }
</style>
</head>
<body>
<main>
  <h1>You are offline</h1>
  <p>PayTMunim needs the demo server for every balance, approval and payment. Nothing is sent or approved while offline, and no earlier result is shown as current.</p>
  <p>Reconnect, then reload. The app will show the server's current state. If the server restarted, earlier tasks are gone.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
