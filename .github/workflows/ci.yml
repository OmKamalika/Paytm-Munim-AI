name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13'
          cache: npm
      - name: Install
        run: npm ci
      - name: Source manifest (120 supplied files)
        run: npm run verify:sources
      - name: Unit, flow and acceptance tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: TypeScript
        run: npx tsc --noEmit --pretty false
      - name: Production build (no .openai/hosting.json, no secrets)
        run: npm run build
